<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research design / Зерттеу дизайны / Araştırma deseni</title>
<style>
/* Layout: one screen, no page scroll. Left = detail panel, right = draw.io-style canvas (one SVG scaled to fit).
   Single light look on purpose (diagram-editor canvas). Works offline: no external files. */
:root{
  --ui:#f5f6f7; --panel:#ffffff; --ink:#1f2328; --muted:#5f6b76; --rule:#d0d7de;
  --edge:#4a5560; --hot:#e6007a; --done:#2e9e4f; --now:#e08a00; --plan:#8a96a3;
  --font:Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ui);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,g.node:focus-visible{outline:3px solid var(--hot);outline-offset:2px}

.bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--rule)}
.bar h1{font-size:15px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool{border:1px solid var(--rule);background:var(--ui);border-radius:6px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.tool:hover{background:#e9ecef}
.tool:disabled{opacity:.4;cursor:default}
.tool[aria-pressed="true"]{background:var(--hot);border-color:var(--hot);color:#fff}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:5px 11px;font-weight:700;font-size:14px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

.work{flex:1;min-height:0;display:grid;grid-template-columns:390px minmax(0,1fr)}
.panel{background:var(--panel);border-right:1px solid var(--rule);overflow:auto;padding:14px 18px 20px}
.card{animation:slide .35s ease both}
.tag{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.swatch{width:14px;height:14px;border:1.5px solid;border-radius:3px;flex:none}
.panel h2{font-size:21px;line-height:1.25;margin:8px 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:13px;font-weight:700;background:var(--ui);border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.chip.done{background:#e3f4e8;border-color:var(--done);color:#17692f}
.chip.now{background:#fff1d6;border-color:var(--now);color:#8a5400}
.chip.plan{background:#eef1f4;border-color:var(--plan);color:#4d5965}
.lead{margin:0 0 4px;font-size:15.5px;font-weight:700}
.panel h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 5px}
.panel h3.key{color:var(--hot)}
.panel ul{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:4px}
.panel li{animation:slide .4s ease both}
.panel a{color:#0b6bcb;font-weight:700;word-break:break-all}
.note{margin:14px 0 0;font-size:13px;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}

.canvas{position:relative;min-width:0;min-height:0;padding:8px;background:#fff}
svg{display:block;width:100%;height:100%}
.lane{fill:#fbfcfd;stroke:#9aa5b1;stroke-width:1}
.lanehead{fill:#eef1f4;stroke:#9aa5b1;stroke-width:1}
.lanetext{font-size:12.5px;font-weight:700;fill:var(--ink);text-anchor:middle}
.legtext{font-size:12.5px;fill:var(--ink)}

.edge{fill:none;stroke:var(--edge);stroke-width:1.6;stroke-dasharray:7 6;animation:flow 1.1s linear infinite, fade .6s ease .8s both;marker-end:url(#arr)}
.edge.back{stroke-dasharray:3 5}
.edge.on{stroke:var(--hot);stroke-width:3;marker-end:url(#arr-on);animation:flow .45s linear infinite}
.elabel{font-size:13px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}

g.node{cursor:pointer;transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;outline:none}
g.node .shape{stroke-width:1.5;transition:stroke-width .15s}
g.node:hover .shape{stroke-width:3}
g.node.on .shape{stroke:var(--hot);stroke-width:3.5}
g.node.on{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both, glow 1.4s ease-in-out infinite}
.dot{stroke:#fff;stroke-width:2}
.lbl{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--font);color:#1f2328;font-size:14px;font-weight:700;line-height:1.15;padding:0 6px;pointer-events:none}
.lbl small{font-size:11px;font-weight:400;margin-top:3px}
.dia .lbl{padding:0 40px;font-size:13.5px}

.sheet{position:absolute;inset:8px;background:rgba(255,255,255,.97);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;overflow:auto;animation:fade .25s ease both}
.sheet h2{margin:0 0 4px;font-size:19px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #9aa5b1;padding:7px 9px;text-align:left;vertical-align:top}
th{background:#dae8fc;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
tbody tr{animation:slide .4s ease both}
td:first-child{font-weight:700;background:#f5f5f5}

@keyframes flow{from{stroke-dashoffset:13}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(230,0,122,0))}50%{filter:drop-shadow(0 0 9px rgba(230,0,122,.75))}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.mflow,.mnav,.short{display:none}
.sheetx{float:right;margin:0 0 8px 12px}
@keyframes mdash{from{background-position:0 0}to{background-position:0 9px}}

/* Phones: the wide canvas is replaced by a vertical flow of large cards; details open as a bottom sheet. */
@media (max-width:860px){
  html,body{height:auto}
  body{display:block;overflow:auto;font-size:16px}
  .bar{position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top,0px))}
  .bar h1,#prev,#next,.full{display:none}
  .short{display:inline}
  .tool,.lang button{padding:10px 13px;font-size:15px}
  .lang{margin-left:auto}
  .work{display:block}
  .canvas{padding:14px 14px 48px;background:var(--ui)}
  .canvas svg{display:none}
  .mflow{display:flex;flex-direction:column;align-items:stretch}
  .mlane{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#e6eaee;border-radius:6px;padding:7px 10px;text-align:center}
  .mlane + .marrow{height:12px}
  .mrow{display:flex;gap:10px}
  .mcard{flex:1 1 0;min-width:0;min-height:62px;border:2px solid;border-radius:10px;padding:10px 10px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center;font-weight:700;font-size:15.5px;line-height:1.2;color:#1f2328;scroll-margin-top:120px;animation:pop .4s ease both}
  .mcard small{font-weight:400;font-size:12.5px}
  .mcard.ell{border-radius:999px}
  .mcard.dia{border-style:dashed;border-width:2.5px}
  .mcard.on{border-color:var(--hot);border-style:solid;box-shadow:0 0 0 4px rgba(230,0,122,.22)}
  .mdot{position:absolute;top:-7px;right:-5px;width:15px;height:15px;border-radius:50%;border:2px solid #fff}
  .marrow{align-self:center;width:2px;height:22px;margin:3px 0 10px;position:relative;background:repeating-linear-gradient(var(--edge) 0 5px,transparent 5px 9px);animation:mdash .6s linear infinite}
  .marrow::after{content:"";position:absolute;left:-5px;bottom:-8px;border:6px solid transparent;border-top:8px solid var(--edge);border-bottom:0}
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:68vh;border-right:0;border-top:4px solid var(--hot);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .3s ease;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .panel.up{transform:none}
  .panel h2{font-size:20px}
  .mnav{display:flex;gap:8px;margin-left:auto}
  .mnav button{min-width:46px;min-height:42px;border:1px solid var(--rule);background:var(--ui);border-radius:8px;font-weight:700;font-size:17px}
  .mnav button:disabled{opacity:.35}
  .sheet{position:fixed;inset:0;z-index:40;border:0;border-radius:0;padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px));padding-top:max(14px,env(safe-area-inset-top,0px));background:#fff}
  .sheet thead{display:none}
  .sheet table,.sheet tbody,.sheet tr,.sheet td{display:block;width:100%}
  .sheet tr{margin-bottom:12px;border:1px solid #9aa5b1;border-radius:8px;overflow:hidden}
  .sheet td{border:0;border-bottom:1px solid #e3e7eb;font-size:15px}
  .sheet td:last-child{border-bottom:0}
  .sheet td::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .sheet td:first-child{background:#dae8fc;font-size:16px}
  .sheet td:first-child::before{display:none}
}
</style>
</head>
<body>
<div class="bar">
  <h1 id="title"></h1>
  <button type="button" class="tool" id="table" aria-pressed="false"></button>
  <button type="button" class="tool" id="prev" aria-label="previous">←</button>
  <button type="button" class="tool" id="play" aria-pressed="false"></button>
  <button type="button" class="tool" id="next" aria-label="next">→</button>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en"><span class="full">English</span><span class="short">EN</span></button>
    <button type="button" data-lang="kk"><span class="full">Қазақша</span><span class="short">ҚАЗ</span></button>
    <button type="button" data-lang="tr"><span class="full">Türkçe</span><span class="short">TR</span></button>
  </div>
</div>
<div class="work">
  <aside class="panel" id="panel" aria-live="polite"></aside>
  <main class="canvas">
    <svg id="svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" role="group" aria-label="flowchart">
      <defs>
        <pattern id="g10" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#eceff2" stroke-width="1"/></pattern>
        <pattern id="g50" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#g10)"/><path d="M50 0H0V50" fill="none" stroke="#dde2e7" stroke-width="1"/></pattern>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5560"/></marker>
        <marker id="arr-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e6007a"/></marker>
      </defs>
      <rect width="1280" height="720" fill="url(#g50)"/>
      <g id="lanes"></g><g id="edges"></g><g id="nodes"></g><g id="legend"></g>
    </svg>
    <div class="mflow" id="mflow"></div>
    <div class="sheet" id="sheet" hidden></div>
  </main>
</div>

 s1:{x:235,y:110,w:170,h:90,s:"rect",c:"teal",when:"2025",st:"done",

  kk:{t:"2-зерттеу: жалпы химиядағы UDL", sub:"106 студент · дейін / кейін", lead:"Оқытудың әмбебап дизайнын (UDL) әдеттегі «Жалпы химия» курсына кіріктіріп, студенттердің семестр ішінде қалай өзгергенін өлшедік.",

  tr:{t:"Çalışma 2: Genel Kimyada UDL", sub:"106 öğrenci · önce / sonra", lead:"Öğrenme için Evrensel Tasarımı (UDL) olağan bir Genel Kimya dersine yerleştirdik ve öğrencilerin dönem boyunca nasıl değiştiğini ölçtük.",

function s(tag, attrs){ const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }

// Build the diagram once; language and selection only update text and classes.
function build(){
  LANES.forEach(([x, w], i) => {
    $("lanes").append(s("rect", {class:"lane", x, y:10, width:w, height:700}), s("rect", {class:"lanehead", x, y:10, width:w, height:34}),
                      s("text", {class:"lanetext", x:x + w / 2, y:32, id:"lane-" + i}));
  });
  E.forEach(([a, b, d, lab, lx, ly, back], i) => {
    $("edges").append(s("path", {class:"edge" + (back ? " back" : ""), d, id:"e-" + i}));
    if (lab) $("edges").append(s("text", {class:"elabel", x:lx, y:ly, id:"el-" + i}));
  });
  ORDER.forEach((id, i) => {
    const n = N[id], [fill, stroke] = C[n.c];
    const g = s("g", {class:"node" + (n.s === "dia" ? " dia" : ""), id:"n-" + id, tabindex:0, role:"button"});
    g.style.animationDelay = (i * 70) + "ms";
    let shape;
    if (n.s === "ell") shape = s("rect", {x:n.x, y:n.y, width:n.w, height:n.h, rx:n.h / 2});
    else if (n.s === "dia") shape = s("polygon", {points:`${n.x + n.w / 2},${n.y} ${n.x + n.w},${n.y + n.h / 2} ${n.x + n.w / 2},${n.y + n.h} ${n.x},${n.y + n.h / 2}`});
    else shape = s("rect", {x:n.x, y:n.y, width:n.w, height:n.h, rx:4});
    shape.setAttribute("class", "shape"); shape.setAttribute("fill", fill); shape.setAttribute("stroke", stroke);
    const fo = s("foreignObject", {x:n.x, y:n.y, width:n.w, height:n.h}); fo.append(h("div", "lbl"));
    const dot = n.s === "dia" ? s("circle", {class:"dot", cx:n.x + n.w / 2, cy:n.y + 4, r:7, fill:STATUS[n.st]})
                              : s("circle", {class:"dot", cx:n.x + n.w - 6, cy:n.y + 6, r:7, fill:STATUS[n.st]});
    g.append(shape, fo, dot);
    g.addEventListener("click", () => { stop(); select(id); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); stop(); select(id); } });
    $("nodes").append(g);
  });
  ["done","now","plan"].forEach((k, i) => {
    $("legend").append(s("circle", {class:"dot", cx:36, cy:600 + i * 26, r:7, fill:STATUS[k]}), s("text", {class:"legtext", x:52, y:604.5 + i * 26, id:"lg-" + k}));
  });
}

function section(title, items, key){
  const f = document.createDocumentFragment(); f.append(h("h3", key ? "key" : "", title));
  const ul = h("ul"); items.forEach((t, i) => { const li = h("li", "", t); li.style.animationDelay = (60 + i * 60) + "ms"; ul.append(li); });
  f.append(ul); return f;
}

function renderSheet(){
  const u = UI[lang], sh = $("sheet"); sh.hidden = !sheetOpen; if (!sheetOpen) return;
  const tbl = h("table"), thead = h("thead"), tr = h("tr"), tb = h("tbody");
  u.th.forEach(t => tr.append(h("th", "", t))); thead.append(tr);
  TABLE[lang].forEach((row, i) => { const r = h("tr"); r.style.animationDelay = (i * 70) + "ms"; row.forEach(c => r.append(h("td", "", c))); tb.append(r); });
  tb.querySelectorAll("tr").forEach(r => [...r.children].forEach((td, j) => td.dataset.l = u.th[j]));
  const x = h("button", "tool sheetx", "✕"); x.type = "button"; x.addEventListener("click", () => { sheetOpen = false; render(); });
  tbl.append(thead, tb); sh.replaceChildren(x, h("h2", "", u.sheetT), h("p", "", u.sheetP), tbl);
}

function render(){
  const u = UI[lang]; document.documentElement.lang = lang;
  $("title").textContent = u.title;
  $("play").textContent = timer ? u.stop : u.play; $("play").setAttribute("aria-pressed", !!timer);
  $("table").textContent = sheetOpen ? u.close : u.table; $("table").setAttribute("aria-pressed", sheetOpen);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  u.lanes.forEach((t, i) => $("lane-" + i).textContent = t);
  ["done","now","plan"].forEach(k => $("lg-" + k).textContent = u[k]);
  E.forEach(([a, b, , lab], i) => {
    $("e-" + i).classList.toggle("on", a === cur || b === cur);
    if (lab) $("el-" + i).textContent = u[lab];
  });
  ORDER.forEach(id => {
    const n = N[id], d = n[lang], g = $("n-" + id), lbl = g.querySelector(".lbl");
    g.classList.toggle("on", id === cur); g.setAttribute("aria-pressed", id === cur); g.setAttribute("aria-label", d.t);
    lbl.replaceChildren(document.createTextNode(d.t));
    const sub = d.sub || n.sub; if (sub) lbl.append(h("small", "", sub));
  });
  const i = ORDER.indexOf(cur); $("prev").disabled = i === 0; $("next").disabled = i === ORDER.length - 1;

  const n = N[cur], d = n[lang], card = h("div", "card"), tag = h("div", "tag"), sw = h("span", "swatch"), chips = h("div", "chips");
  sw.style.background = C[n.c][0]; sw.style.borderColor = C[n.c][1];
  tag.append(sw, document.createTextNode((i + 1) + " / " + ORDER.length));
  const mnav = h("div", "mnav"), bp = h("button", "", "←"), bn = h("button", "", "→"), bx = h("button", "", "✕");
  bp.type = bn.type = bx.type = "button"; bp.disabled = i === 0; bn.disabled = i === ORDER.length - 1;
  bp.addEventListener("click", () => { stop(); step(-1); }); bn.addEventListener("click", () => { stop(); step(1); });
  bx.addEventListener("click", () => { stop(); panelUp = false; render(); });
  mnav.append(bp, bn, bx); tag.append(mnav);
  chips.append(h("span", "chip", n.when), h("span", "chip " + n.st, u[n.st]));
  card.append(tag, h("h2", "", d.t), chips, h("p", "lead", d.lead));
  SECTIONS.forEach(k => { if (d[k]) card.append(section(u[k], d[k], k === "tools")); });
  if (n.link) { const a = h("a", "", SITE); a.href = SITE; a.target = "_blank"; a.rel = "noopener"; const p = h("p"); p.append(a); card.append(p); }
  if (d.note) card.append(h("p", "note", d.note));
  $("panel").replaceChildren(card); $("panel").scrollTop = 0; $("panel").classList.toggle("up", panelUp);

  const mf = $("mflow"); mf.replaceChildren();
  MROWS.forEach((row, r) => {
    if (r) mf.append(h("div", "marrow"));
    if (typeof row === "number") { mf.append(h("div", "mlane", u.lanes[row])); return; }
    const line = h("div", "mrow");
    row.forEach(id => {
      const m = N[id], md = m[lang], b = h("button", "mcard " + m.s + (id === cur && panelUp ? " on" : "")), dot = h("span", "mdot");
      b.type = "button"; b.id = "m-" + id; b.style.background = C[m.c][0]; b.style.borderColor = id === cur && panelUp ? "" : C[m.c][1];
      dot.style.background = STATUS[m.st];
      b.append(document.createTextNode((m.s === "dia" ? "◆ " : "") + md.t));
      const sub = m.s === "dia" ? u.yes + " ↓   ·   " + u.no + " ↺" : (md.sub || m.sub); if (sub) b.append(h("small", "", sub));
      b.append(dot); b.addEventListener("click", () => { stop(); select(id); });
      line.append(b);
    });
    mf.append(line);
  });
  renderSheet();
}

function select(id){

  cur = id; sheetOpen = false; panelUp = !again; render();
  if (phone() && panelUp) $("m-" + id).scrollIntoView({ block:"start", behavior: calm() ? "auto" : "smooth" });
}
function step(k){
  const id = ORDER[Math.max(0, Math.min(ORDER.length - 1, ORDER.indexOf(cur) + k))];
  if (id !== cur || !panelUp) { panelUp = false; select(id); }
}
function stop(){ if (timer) { clearInterval(timer); timer = null; render(); } }
$("prev").addEventListener("click", () => { stop(); step(-1); });
$("next").addEventListener("click", () => { stop(); step(1); });
$("table").addEventListener("click", () => { stop(); sheetOpen = !sheetOpen; render(); });
$("play").addEventListener("click", () => {
  if (timer) return stop();
  sheetOpen = false; if (ORDER.indexOf(cur) === ORDER.length - 1) cur = ORDER[0];
  timer = setInterval(() => { if (ORDER.indexOf(cur) === ORDER.length - 1) stop(); else step(1); }, 3500);
  render();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetOpen) { sheetOpen = false; render(); return; }
  if (e.target.closest && e.target.closest("g.node")) return;
  if (e.key === "ArrowRight") { stop(); step(1); } else if (e.key === "ArrowLeft") { stop(); step(-1); }
});
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("rd-lang3", lang); } catch (e) {} render();
}));
build(); render();
</script>
</body>
</html>
